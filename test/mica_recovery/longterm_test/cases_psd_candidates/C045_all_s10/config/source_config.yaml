# Same native inference settings as prior two-component tests.
source: LTSIM
reference_band: UVW2
response_bands:
- U
mica_stages:
- mica_gaussian2
- mica_gamma2
mica_gaussian2:
  output_root: runs/mica
  prepared_dir: input
  driver: UVW2
  responses:
  - U
  run_template: run_{driver}_to_{band}_{ncomp}comp_{type_tf}
  ncomp: 2
  type_tf: gaussian
  type_lag_prior: 0
  lag_limit:
  - 0.0
  - 100.0
  lag_prior:
  - - 0.0
    - 100.0
  - - 0.0
    - 100.0
  width_prior:
  - - 0.14195358
    - 152.84
  - - 0.14195358
    - 152.84
  flag_lag_posivity: false
  flag_negative_resp: false
  flag_con_sys_err: false
  flag_line_sys_err: false
  flag_trend: 0
  max_num_saves: 10000
  mpi_per_band: 2
  max_parallel: 1
  num_particles: 1
  ptol: 0.01
  fit_only: false
  plot_decomp: true
  component_order: native
mica_gamma2:
  output_root: runs/mica
  prepared_dir: input
  driver: UVW2
  responses:
  - U
  run_template: run_{driver}_to_{band}_{ncomp}comp_{type_tf}
  ncomp: 2
  type_tf: gamma
  type_lag_prior: 4
  lag_limit:
  - 0.0
  - 100.0
  lag_prior:
  - - 0.0
    - 100.0
  - - 0.0
    - 100.0
  width_prior:
  - - 0.14195357999999997
    - 152.84
  - - 0.14195357999999997
    - 152.84
  flag_lag_posivity: false
  flag_negative_resp: false
  flag_con_sys_err: false
  flag_line_sys_err: false
  flag_trend: 0
  max_num_saves: 10000
  mpi_per_band: 2
  max_parallel: 1
  num_particles: 1
  ptol: 0.01
  fit_only: false
  plot_decomp: true
